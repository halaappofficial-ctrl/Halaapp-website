<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- The link to this page carries a password-reset token in its address (?t=), and for 60 minutes that token can set
     the password on someone's account. So this page is never indexed, never sends its address on in a Referer (not to
     the backend, not to the next page), loads no script from anywhere else, and carries NO analytics: Vercel Web
     Analytics is on every other page and deliberately absent here. The policy below makes that hold in the browser,
     not only in this file: no script source at all and no connection except the backend, so an analytics tag pasted in
     by a later sweep of every page could neither load nor report. verify-reset-password.cjs holds all of it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://hala-backend-production.up.railway.app; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>HALA MOVE - Set a new password</title>
<style>
  :root{ --bg:#0A0A0A; --card:#151515; --line:#262626; --text:#FFFFFF; --muted:#A3A3A3; --green:#5CB558; --red:#FF5A5A; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,sans-serif; }
  *{ box-sizing:border-box; }
  header{ display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  .brand{ font-weight:900; font-size:20px; letter-spacing:0.5px; color:var(--green); }
  .panel{ max-width:520px; margin:0 auto; padding:20px 16px 40px; }
  h1{ font-size:24px; font-weight:800; margin:4px 0 6px; }
  .sub{ font-size:15px; color:var(--muted); margin:0 0 4px; line-height:1.5; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:16px; }
  label{ display:block; font-size:14px; font-weight:700; margin:14px 0 6px; }
  label:first-child{ margin-top:0; }
  input[type=password], input[type=text]{ width:100%; font-size:17px; padding:13px 12px; border-radius:10px;
    border:1px solid #3a3a3a; background:#0F0F0F; color:var(--text); }
  input:focus{ outline:none; border-color:var(--green); }
  /* A field that must be filled carries a red asterisk after its label (the apps' error red #FF4444). The inputs
     carry required, so a screen reader already says it and the star is hidden from it. */
  .req{ color:#FF4444; font-weight:700; }
  .hint{ font-size:12px; color:var(--muted); margin-top:6px; line-height:1.4; }
  .show{ background:none; border:0; padding:10px 0 0; color:var(--green); font-size:14px; font-weight:700; cursor:pointer; }
  .show:focus-visible, .btn:focus-visible{ outline:2px solid var(--green); outline-offset:3px; }
  .btn{ display:block; width:100%; text-align:center; background:var(--green); color:#0A0A0A; font-weight:800; font-size:17px;
    padding:15px; border-radius:12px; margin-top:18px; border:0; cursor:pointer; }
  .btn[disabled]{ opacity:0.6; cursor:default; }
  .error{ margin-top:14px; padding:12px; border-radius:10px; border:1px solid var(--red); background:rgba(255,90,90,0.12);
    color:var(--red); font-size:14px; line-height:1.4; }
  .msg{ text-align:center; padding:60px 20px; }
  .msg h1{ font-size:22px; margin:0 0 10px; }
  .msg p{ color:var(--muted); font-size:15px; line-height:1.5; margin:0 auto; max-width:420px; }
  .msg .btn{ max-width:240px; margin:22px auto 0; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<header>
  <div class="brand">HALA MOVE</div>
</header>

<div id="main" class="panel hidden">
  <p class="sub" id="hello"></p>
  <h1>Choose a new password</h1>
  <p class="sub" id="lead"></p>

  <form class="card" id="form" novalidate>
    <label for="pw">New password<span class="req" aria-hidden="true"> *</span></label>
    <input type="password" id="pw" autocomplete="new-password" minlength="8" maxlength="128" required aria-describedby="pw-hint">
    <div class="hint" id="pw-hint">At least 8 characters.</div>

    <label for="pw2">Type it again<span class="req" aria-hidden="true"> *</span></label>
    <input type="password" id="pw2" autocomplete="new-password" minlength="8" maxlength="128" required>

    <button class="show" id="show" type="button" aria-pressed="false" aria-controls="pw pw2">Show password</button>

    <div class="error hidden" id="error" role="alert"></div>
    <button class="btn" id="submit" type="submit">Save my new password</button>
  </form>
</div>

<div id="done" class="msg hidden">
  <h1>You can sign in now</h1>
  <p id="done-text"></p>
</div>
<div id="ended" class="msg hidden">
  <h1>This link has ended</h1>
  <p id="ended-text"></p>
</div>
<div id="invalid" class="msg hidden">
  <h1>We could not read this link</h1>
  <p id="invalid-text"></p>
</div>
<div id="down" class="msg hidden">
  <h1>We could not check your link</h1>
  <p id="down-text"></p>
  <button class="btn" id="retry" type="button">Try again</button>
</div>
<div id="loading" class="msg"><p>Checking your link...</p></div>

<script>
// THE PASSWORD RESET PAGE (2026-11-10). halamove.co.za/reset-password?t=<token>, linked from the "Forgot password"
// email both apps send. The backend owns every rule (backend src/services/passwordReset.js): whether the link still
// works (60 minutes, once, and only until another reset link is used), which app it is for, and how long a password
// must be. GET /api/auth/password-reset says whether the link works; POST sets the password. Every answer that is
// not a success carries a sentence, and this page shows it as it is. The sentences below are only for when the
// server sends none, and say the same thing.
(function () {
  'use strict';
  var API = 'https://hala-backend-production.up.railway.app/api/auth/password-reset';
  var MIN = 8, MAX = 128;
  var SAID = {
    invalid: 'This link is not valid. Open the whole link from the email, or ask for a new one in the app: tap Forgot password on the sign-in screen.',
    ended: 'This link has expired or has already been used. Ask for a new one in the app: tap Forgot password on the sign-in screen.',
    down: 'Something went wrong on our side and your password was not changed. Please try again in a minute.',
    weak: 'Use at least 8 characters.',
    done: 'Your password is changed. Open the app and sign in with your email and your new password.',
  };
  var APP = { customer: 'HALA MOVE', driver: 'HALA MOVE Driver' };
  var $ = function (id) { return document.getElementById(id); };
  var VIEWS = ['main', 'done', 'ended', 'invalid', 'down', 'loading'];
  function show(id) { VIEWS.forEach(function (k) { $(k).classList.toggle('hidden', k !== id); }); }
  function say(view, message, fallback) { $(view + '-text').textContent = message || fallback; show(view); }
  function setError(msg) { $('error').textContent = msg || ''; $('error').classList.toggle('hidden', !msg); }

  var token = new URLSearchParams(window.location.search || '').get('t') || '';
  if (!token.trim()) { say('invalid', '', SAID.invalid); return; }

  // Every reply as { status, body }; a body that is not JSON reads as {}.
  function call(init) {
    var url = init ? API : API + '?t=' + encodeURIComponent(token);
    var opts = { cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' };
    if (init) { opts.method = 'POST'; opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(init); }
    return fetch(url, opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) { return { status: res.status, body: body || {} }; });
    });
  }

  function load() {
    show('loading');
    call(null).then(function (r) {
      if (r.status === 200 && r.body.valid === true) {
        $('hello').textContent = r.body.first_name ? 'Hi ' + r.body.first_name + ',' : '';
        var app = APP[r.body.app];
        $('lead').textContent = app ? 'For your ' + app + ' account.' : '';
        show('main');
        $('pw').focus();
        return;
      }
      if (r.status === 404) return say('invalid', r.body.message, SAID.invalid);
      if (r.status === 410) return say('ended', r.body.message, SAID.ended);
      say('down', r.body.message, SAID.down);
    }).catch(function () { say('down', '', SAID.down); });
  }

  $('retry').addEventListener('click', load);

  $('show').addEventListener('click', function () {
    var on = $('show').getAttribute('aria-pressed') !== 'true';
    $('pw').type = on ? 'text' : 'password';
    $('pw2').type = on ? 'text' : 'password';
    $('show').setAttribute('aria-pressed', on ? 'true' : 'false');
    $('show').textContent = on ? 'Hide password' : 'Show password';
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    setError('');
    var pw = $('pw').value, pw2 = $('pw2').value;
    if (pw.length < MIN || pw.length > MAX) { $('pw').focus(); return setError(SAID.weak); }
    if (pw !== pw2) { $('pw2').focus(); return setError('The two passwords are not the same. Type the new one again in both boxes.'); }
    var btn = $('submit');
    btn.disabled = true; btn.textContent = 'Saving...';
    call({ token: token, password: pw }).then(function (r) {
      btn.disabled = false; btn.textContent = 'Save my new password';
      if (r.status === 200 && r.body.reset === true) {
        $('pw').value = ''; $('pw2').value = '';
        return say('done', r.body.message, SAID.done);
      }
      if (r.status === 404) return say('invalid', r.body.message, SAID.invalid);
      if (r.status === 410) return say('ended', r.body.message, SAID.ended);
      if (r.status === 400) return setError(r.body.message || SAID.weak);
      setError(r.body.message || SAID.down);
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Save my new password';
      setError('Your new password did not reach us, so it is not changed yet. Check your connection and try again.');
    });
  });

  load();
})();
</script>
</body>
</html>
