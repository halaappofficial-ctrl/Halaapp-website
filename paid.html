<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<title>HALA MOVE — Payment received</title>
<meta name="robots" content="noindex">
<style>
  html,body{ margin:0; padding:0; background:#0A0A0A; color:#FFFFFF;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,sans-serif; }
  .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; box-sizing:border-box; text-align:center; }
  .tick{ width:76px; height:76px; border-radius:38px; margin-bottom:26px;
    background:rgba(92,181,88,0.14); border:2px solid #5CB558; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 10px rgba(92,181,88,0.06); }
  .wordmark{ font-weight:900; font-size:34px; letter-spacing:1px; margin-bottom:22px; }
  .wordmark .h{ color:#5CB558; } .wordmark .m{ color:#FFFFFF; }
  h1{ font-size:24px; font-weight:700; margin:0 0 12px; }
  p{ font-size:16px; line-height:1.55; opacity:0.85; max-width:400px; margin:0 0 22px; }
  .hint{ font-size:13px; opacity:0.5; }
  .back{ display:none; background:#5CB558; color:#0A0A0A; font-weight:800; font-size:17px; text-decoration:none;
    padding:15px 26px; border-radius:14px; margin:0 0 18px; min-width:240px; box-sizing:border-box; }
  .back.on{ display:inline-block; }
</style>
</head>
<body>
<main class="wrap">
  <div class="tick">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#5CB558" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg>
  </div>
  <div class="wordmark"><span class="h">HALA</span> <span class="m">MOVE</span></div>
  <h1>Payment received</h1>
  <p>Your payment is secured in escrow. Return to the HALA MOVE app to continue with your job — it will update automatically.</p>
  <a class="back" id="back-to-app" href="halamove://paid">Back to the HALA MOVE app</a>
  <p class="hint">You can safely close this tab.</p>
</main>
<script>
// The app opens PayFast INSIDE itself since 2026-10-27, so this page can be showing in the app's own
// browser. On a phone, this button hands the customer straight back: on Android it closes the
// in-app browser, on iPhone the app closes it itself once the payment shows. Shown on phones only,
// since a computer has no app to open. The job id goes with it so the app knows which job it is.
(function () {
  try {
    if (!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '')) return;
    var a = document.getElementById('back-to-app');
    if (!a) return;
    var m = /[?&]job_id=([0-9a-fA-F-]{36})(?:&|$)/.exec(window.location.search || '');
    if (m) a.href = 'halamove://paid?job_id=' + m[1];
    a.className = 'back on';
  } catch (e) {}
})();
</script>
<script>
// Tell the backend which page PayFast sent this customer back to (2026-10-12). Without it a
// failed checkout could not say whether the customer pressed Cancel at PayFast or never came back
// at all. Best effort, no personal data, the page works the same if it fails. Same shape as the
// creator page beacon, which has recorded 888 clicks from this site.
(function () {
  try {
    var m = /[?&]job_id=([0-9a-fA-F-]{36})(?:&|$)/.exec(window.location.search || '');
    if (!m) return;
    fetch('https://hala-backend-production.up.railway.app/api/payments/return-seen', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: m[1], page: 'paid' }), keepalive: true
    }).catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
